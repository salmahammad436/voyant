

services:
  mongodb:
    image: mongo:6.0
    container_name: voyMongodb_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass@123

  app:
    image: oven/bun:1.2.2
    container_name: voyant_container
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    command: sh -c "apt-get update && apt-get install -y chromium && bun install && bun run dev --watch"
    depends_on:
      - mongodb
    environment:
      DB_URL: "mongodb://root:pass@123@mongodb:27017"  

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_container
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: root  
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass@123  
      ME_CONFIG_BASICAUTH_USERNAME: admin 
      ME_CONFIG_BASICAUTH_PASSWORD: admin123

volumes:
  mongodb_data:
